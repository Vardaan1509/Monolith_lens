# Billing: invoices and payments. Legitimately depends on Accounts (needs a
# user to bill) and the root package "." (framework base classes). It does NOT
# declare Reporting - but its code references Reporting anyway (an undeclared
# reference). Combined with Reporting declaring Billing, that forms an
# intentional dependency cycle: Packwerk can only report it as an undeclared
# reference, while MonolithLens surfaces it as a cycle.
enforce_dependencies: true
dependencies:
  - "."
  - packs/accounts
