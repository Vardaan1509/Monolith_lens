plugins:
  - rubocop-performance
  - rubocop-rspec

AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable
  SuggestExtensions: false

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

# RSpec `describe` blocks legitimately grow long (many `it` examples), so the
# block-length metric is not meaningful for spec files.
Metrics/BlockLength:
  Exclude:
    - "spec/**/*"
    - "*.gemspec"

# Our tests favour "one scenario, several related assertions" over strict
# one-assertion-per-example. Defaults (5 lines / 1 expectation) are too tight
# for that style; these limits still catch genuinely bloated examples.
RSpec/ExampleLength:
  Max: 15

RSpec/MultipleExpectations:
  Max: 5
