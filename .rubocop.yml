plugins:
  - rubocop-performance
  - rubocop-rspec

AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    # The demo Rails app is a fixture we analyze, not part of the gem's own
    # code. It has its own conventions and isn't linted by the gem's RuboCop.
    - "demo_app/**/*"

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

# RSpec `describe` blocks legitimately grow long (many `it` examples), so the
# block-length metric is not meaningful for spec files.
Metrics/BlockLength:
  Exclude:
    - "spec/**/*"
    - "*.gemspec"

# Our tests favour "one scenario, several related assertions" over strict
# one-assertion-per-example. Defaults (5 lines / 1 expectation) are too tight
# for that style; these limits still catch genuinely bloated examples.
RSpec/ExampleLength:
  Max: 15

RSpec/MultipleExpectations:
  Max: 5

# Integration specs scan the real demo app; they are feature-style (described
# by a string, not a class), so the class-name/path conventions don't apply.
RSpec/DescribeClass:
  Exclude:
    - "spec/integration/**/*"

RSpec/SpecFilePathFormat:
  Exclude:
    - "spec/integration/**/*"

RSpec/DescribeMethod:
  Exclude:
    - "spec/integration/**/*"

# A Prism visitor legitimately has many small methods (one per node type plus
# helpers); 120 gives reasonable headroom over the 100 default.
Metrics/ClassLength:
  Max: 120
