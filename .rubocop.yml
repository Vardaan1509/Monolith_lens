AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable
  SuggestExtensions: false

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

# RSpec `describe` blocks legitimately grow long (many `it` examples), so the
# block-length metric is not meaningful for spec files.
Metrics/BlockLength:
  Exclude:
    - "spec/**/*"
    - "*.gemspec"
